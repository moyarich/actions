name: Deploy playground to GitHub Pages
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
jobs:
  pages:
    uses: moyarich/workspace-tools/.github/workflows/reusable_github-pages.yml@workflows-v0.1.0
    with:
      node-version: "24"
      build-command: npm run build:playground -- --base=/my-project/
      output-directory: apps/playground/dist
    secrets: inherit
