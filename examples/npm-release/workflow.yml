name: Release package
on:
  workflow_dispatch:
    inputs:
      package:
        description: Package directory or workspace name
        required: true
        default: packages/my-package
        type: string
      dry-run:
        description: Preview without making changes
        required: true
        default: true
        type: boolean
permissions:
  contents: write
jobs:
  release:
    uses: moyarich/workspace-tools/.github/workflows/reusable_npm-release.yml@workflows-v0.1.0
    with:
      package: ${{ inputs.package }}
      target-branch: main
      dry-run: ${{ inputs.dry-run }}
      version-mode: bump
      version-bump: patch
      node-version: "24"
