name: Prettier self-heal
on:
  workflow_dispatch:
    inputs:
      commit:
        description: Commit formatting fixes
        required: true
        default: false
        type: boolean
permissions:
  contents: write
jobs:
  prettier:
    uses: moyarich/workspace-tools/.github/workflows/reusable_prettier.yml@v0.1.0
    with:
      commit: ${{ inputs.commit }}
      node-version: "24"
