name: Prepare package release
on:
  workflow_dispatch:
    inputs:
      package:
        description: Package directory or workspace name
        required: true
        default: packages/my-package
        type: string
permissions:
  contents: write
  pull-requests: write
  packages: read
jobs:
  prepare:
    uses: moyarich/actions/.github/workflows/reusable_npm-prepare-release.yml@v0.1.0
    with:
      package: ${{ inputs.package }}
      target-branch: main
      version-mode: bump
      version-bump: patch
      node-version: "24"
    secrets: inherit
