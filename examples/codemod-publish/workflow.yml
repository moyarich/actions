name: Publish codemod
on:
  workflow_dispatch:
    inputs:
      dry-run:
        description: Validate without publishing
        required: true
        default: true
        type: boolean
jobs:
  publish:
    uses: moyarich/workspace-tools/.github/workflows/reusable_codemod-publish.yml@workflows-v0.1.0
    with:
      target-branch: main
      codemod-directory: packages/my-codemod
      dry-run: ${{ inputs.dry-run }}
      node-version: "24"
    secrets: inherit
