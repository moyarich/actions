name: Self-heal

on:
  pull_request:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: write
  packages: read

concurrency:
  group: self-heal-${{ github.ref }}
  cancel-in-progress: false

jobs:
  prettier:
    uses: ./.github/workflows/reusable_prettier.yml
    with:
      commit: true
      node-version: "24"

  package-lock:
    needs: prettier
    uses: ./.github/workflows/reusable_npm-package-lock.yml
    with:
      commit: true
      node-version: "24"
    secrets:
      package-token: ${{ secrets._GITHUB_TOKEN }}


  action-dist:
    name: Build action dist
    needs: package-lock
    runs-on: ubuntu-latest

    steps:
      - name: Checkout source branch
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event_name == 'pull_request' && github.head_ref || github.ref_name }}
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "24"
          cache: npm

      - name: Install dependencies
        run: npm ci --ignore-scripts

      - name: Build action runtime
        run: npm run build:actions

      - name: Commit generated dist
        shell: bash
        run: |
          set -euo pipefail

          if [ -z "$(git status --porcelain -- dist/)" ]; then
            echo "Action dist is already current."
            exit 0
          fi

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -f dist/
          git commit -m "build: update action dist"
          git push
