name: "Reusable · Release"

on:
  workflow_call:
    inputs:
      version:
        description: Release semantic version
        required: true
        type: string
      release-tag:
        description: Immutable release tag
        required: true
        type: string
      release-name:
        description: GitHub Release name
        required: true
        type: string
      changelog-file:
        description: Changelog containing the version section
        required: true
        type: string
      target-ref:
        description: Commit or branch the release tag should resolve to
        required: false
        default: main
        type: string
      dry-run:
        description: Preview without creating or changing tags/releases
        required: false
        default: true
        type: boolean
      create-tag:
        description: Create the immutable release tag when it does not already exist
        required: false
        default: false
        type: boolean
      major-tag:
        description: Optional moving major compatibility tag
        required: false
        default: ""
        type: string
      update-major-tag:
        description: Move major-tag to this release
        required: false
        default: false
        type: boolean
      draft:
        description: Keep the GitHub Release as a draft
        required: false
        default: true
        type: boolean
    outputs:
      release-url:
        description: GitHub Release URL
        value: ${{ jobs.release.outputs.release-url }}
      release-id:
        description: GitHub Release ID
        value: ${{ jobs.release.outputs.release-id }}
      release-tag:
        description: Immutable release tag
        value: ${{ jobs.release.outputs.release-tag }}
      release-status:
        description: preview, created, reused, or failed
        value: ${{ jobs.release.outputs.release-status }}

permissions: {}

jobs:
  release:
    name: "job: Release"
    runs-on: ubuntu-latest
    permissions:
      contents: write
    outputs:
      release-url: ${{ steps.release.outputs.url }}
      release-id: ${{ steps.release.outputs.id }}
      release-tag: ${{ inputs.release-tag }}
      release-status: ${{ steps.release.outputs.status || 'preview' }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
        with:
          ref: ${{ inputs.target-ref }}
          fetch-depth: 0

      - name: Validate release identity
        env:
          VERSION: ${{ inputs.version }}
          RELEASE_TAG: ${{ inputs.release-tag }}
          RELEASE_NAME: ${{ inputs.release-name }}
          CHANGELOG_FILE: ${{ inputs.changelog-file }}
          MAJOR_TAG: ${{ inputs.major-tag }}
        shell: bash
        run: |
          set -euo pipefail

          if ! [[ "$VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.-]+)?(\+[0-9A-Za-z.-]+)?$ ]]; then
            echo "::error::Release version must be valid SemVer without a leading v."
            exit 1
          fi

          test -n "$RELEASE_TAG" || { echo "::error::release-tag is required."; exit 1; }
          test -n "$RELEASE_NAME" || { echo "::error::release-name is required."; exit 1; }
          test -f "$CHANGELOG_FILE" || { echo "::error::Changelog not found: $CHANGELOG_FILE"; exit 1; }

          if [ "${{ inputs.update-major-tag }}" = "true" ] && [ -z "$MAJOR_TAG" ]; then
            echo "::error::major-tag is required when update-major-tag is enabled."
            exit 1
          fi

      - name: Resolve release notes
        id: notes
        env:
          VERSION: ${{ inputs.version }}
          CHANGELOG_FILE: ${{ inputs.changelog-file }}
        shell: bash
        run: |
          set -euo pipefail

          NOTES="$(
            awk -v version="$VERSION" '
              $0 ~ "^## \\[" version "\\]" || $0 ~ "^## " version "([[:space:]]|$)" { in_section=1 }
              in_section && /^## / &&
                $0 !~ "^## \\[" version "\\]" &&
                $0 !~ "^## " version "([[:space:]]|$)" { exit }
              in_section { print }
            ' "$CHANGELOG_FILE"
          )"

          if [ -z "$NOTES" ]; then
            echo "::error::$CHANGELOG_FILE has no release section for $VERSION."
            exit 1
          fi

          NOTES_FILE="$RUNNER_TEMP/release-notes.md"
          printf '%s\n' "$NOTES" > "$NOTES_FILE"
          echo "file=$NOTES_FILE" >> "$GITHUB_OUTPUT"

      - name: Inspect release state
        id: state
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ inputs.release-tag }}
        shell: bash
        run: |
          set -euo pipefail

          TAG_COMMIT="$(git rev-parse --verify --quiet "refs/tags/$RELEASE_TAG^{commit}" || true)"
          TARGET_COMMIT="$(git rev-parse HEAD)"

          if [ -n "$TAG_COMMIT" ] && [ "$TAG_COMMIT" != "$TARGET_COMMIT" ]; then
            echo "::error::Immutable tag $RELEASE_TAG already points to $TAG_COMMIT, not $TARGET_COMMIT."
            exit 1
          fi

          RELEASE="$(
            gh api --paginate --slurp "repos/$GITHUB_REPOSITORY/releases?per_page=100" |
              jq -c --arg tag "$RELEASE_TAG" '[.[][] | select(.tag_name == $tag)] | first // empty'
          )"

          {
            echo "tag-exists=$([ -n "$TAG_COMMIT" ] && echo true || echo false)"
            echo "target-commit=$TARGET_COMMIT"
            if [ -n "$RELEASE" ]; then
              echo "release-exists=true"
              echo "release-id=$(jq -r '.id' <<< "$RELEASE")"
              echo "release-url=$(jq -r '.html_url' <<< "$RELEASE")"
              echo "release-draft=$(jq -r '.draft' <<< "$RELEASE")"
            else
              echo "release-exists=false"
            fi
          } >> "$GITHUB_OUTPUT"

      - name: Release preview
        if: ${{ inputs.dry-run }}
        env:
          NOTES_FILE: ${{ steps.notes.outputs.file }}
        shell: bash
        run: |
          {
            echo "# Release preview"
            echo
            echo "| Setting | Value |"
            echo "| --- | --- |"
            printf '| Version | `%s` |\n' "${{ inputs.version }}"
            printf '| Immutable tag | `%s` |\n' "${{ inputs.release-tag }}"
            printf '| Release name | `%s` |\n' "${{ inputs.release-name }}"
            printf '| Target | `%s` |\n' "${{ steps.state.outputs.target-commit }}"
            printf '| Create tag | **%s** |\n' "${{ inputs.create-tag }}"
            printf '| Major alias | `%s` |\n' "${{ inputs.major-tag }}"
            printf '| Update major alias | **%s** |\n' "${{ inputs.update-major-tag }}"
            printf '| GitHub Release draft | **%s** |\n' "${{ inputs.draft }}"
            echo
            echo "## Release notes"
            cat "$NOTES_FILE"
            echo
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Create immutable tag
        if: ${{ !inputs.dry-run && inputs.create-tag && steps.state.outputs.tag-exists != 'true' }}
        env:
          RELEASE_TAG: ${{ inputs.release-tag }}
        shell: bash
        run: |
          set -euo pipefail
          git tag "$RELEASE_TAG" HEAD
          git push origin "refs/tags/$RELEASE_TAG:refs/tags/$RELEASE_TAG"

      - name: Update major compatibility tag
        if: ${{ !inputs.dry-run && inputs.update-major-tag }}
        env:
          MAJOR_TAG: ${{ inputs.major-tag }}
        shell: bash
        run: |
          set -euo pipefail
          git tag --force "$MAJOR_TAG" HEAD
          git push --force origin "refs/tags/$MAJOR_TAG:refs/tags/$MAJOR_TAG"

      - name: Ensure GitHub Release
        id: release
        if: ${{ !inputs.dry-run }}
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ inputs.release-tag }}
          RELEASE_NAME: ${{ inputs.release-name }}
          NOTES_FILE: ${{ steps.notes.outputs.file }}
        shell: bash
        run: |
          set -euo pipefail

          EXISTING="$(
            gh api --paginate --slurp "repos/$GITHUB_REPOSITORY/releases?per_page=100" |
              jq -c --arg tag "$RELEASE_TAG" '[.[][] | select(.tag_name == $tag)] | first // empty'
          )"

          if [ -n "$EXISTING" ]; then
            RELEASE_ID="$(jq -r '.id' <<< "$EXISTING")"
            RELEASE_URL="$(jq -r '.html_url' <<< "$EXISTING")"
            STATUS="reused"
          else
            ARGS=(
              "$RELEASE_TAG"
              --repo "$GITHUB_REPOSITORY"
              --title "$RELEASE_NAME"
              --notes-file "$NOTES_FILE"
            )

            if [ "${{ inputs.draft }}" = "true" ]; then
              ARGS+=(--draft)
            fi

            gh release create "${ARGS[@]}"
            CREATED="$(gh api "repos/$GITHUB_REPOSITORY/releases/tags/$RELEASE_TAG")"
            RELEASE_ID="$(jq -r '.id' <<< "$CREATED")"
            RELEASE_URL="$(jq -r '.html_url' <<< "$CREATED")"
            STATUS="created"
          fi

          {
            echo "id=$RELEASE_ID"
            echo "url=$RELEASE_URL"
            echo "status=$STATUS"
          } >> "$GITHUB_OUTPUT"

          {
            echo "# Release"
            echo
            printf -- '- Tag: `%s`\n' "$RELEASE_TAG"
            printf -- '- GitHub Release: %s\n' "$RELEASE_URL"
            printf -- '- Result: **%s**\n' "$STATUS"
            echo
          } >> "$GITHUB_STEP_SUMMARY"
