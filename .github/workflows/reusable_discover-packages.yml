name: "Reusable · Discover Packages"

on:
  workflow_dispatch:
    inputs:
      packages-directory:
        description: Directory containing direct-child packages when workspace discovery is disabled
        required: true
        default: packages
        type: string
      use-workspaces:
        description: Discover packages from root package.json workspaces patterns
        required: true
        default: false
        type: boolean
      include-root-package:
        description: Include the repository root package.json when it matches the filters
        required: true
        default: false
        type: boolean
      include-private:
        description: Include private packages
        required: true
        default: false
        type: boolean
      require-publish-config:
        description: Only include publishable packages
        required: true
        default: false
        type: boolean
      require-test-script:
        description: Only include packages with a test script
        required: true
        default: false
        type: boolean
      require-build-script:
        description: Only include packages with a build script
        required: true
        default: false
        type: boolean
      node-version:
        description: Node.js version
        required: true
        default: "24"
        type: string

  workflow_call:
    inputs:
      packages-directory:
        required: false
        default: packages
        type: string
      use-workspaces:
        required: false
        default: false
        type: boolean
      include-root-package:
        required: false
        default: false
        type: boolean
      include-private:
        required: false
        default: false
        type: boolean
      require-publish-config:
        required: false
        default: false
        type: boolean
      require-test-script:
        required: false
        default: false
        type: boolean
      require-build-script:
        required: false
        default: false
        type: boolean
      node-version:
        required: false
        default: "24"
        type: string
    outputs:
      packages:
        description: Compact JSON array of discovered packages
        value: ${{ jobs.discover.outputs.packages }}
      matrix:
        description: GitHub Actions matrix object with include array
        value: ${{ jobs.discover.outputs.matrix }}
      has-packages:
        description: Whether any packages matched
        value: ${{ jobs.discover.outputs.has-packages }}
      count:
        description: Number of matching packages
        value: ${{ jobs.discover.outputs.count }}

permissions:
  contents: read

jobs:
  discover:
    name: "job: Discover"
    runs-on: ubuntu-latest
    outputs:
      packages: ${{ steps.packages.outputs.packages }}
      matrix: ${{ steps.packages.outputs.matrix }}
      has-packages: ${{ steps.packages.outputs.has-packages }}
      count: ${{ steps.packages.outputs.count }}

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: ${{ inputs.node-version }}

      - id: packages
        name: Discover packages
        uses: ./discover-packages
        env:
          PACKAGES_DIRECTORY: ${{ inputs.packages-directory }}
          USE_WORKSPACES: ${{ inputs.use-workspaces }}
          INCLUDE_ROOT_PACKAGE: ${{ inputs.include-root-package }}
          INCLUDE_PRIVATE: ${{ inputs.include-private }}
          REQUIRE_PUBLISH_CONFIG: ${{ inputs.require-publish-config }}
          REQUIRE_TEST_SCRIPT: ${{ inputs.require-test-script }}
          REQUIRE_BUILD_SCRIPT: ${{ inputs.require-build-script }}
