name: "Reusable · Discover Packages"

on:
  workflow_dispatch:
    inputs:
      packages-directory:
        description: Directory containing direct-child packages when workspace discovery is disabled
        required: true
        default: packages
        type: string
      use-workspaces:
        description: Discover packages from root package.json workspaces patterns
        required: true
        default: false
        type: boolean
      include-root-package:
        description: Include the repository root package.json when it matches the filters
        required: true
        default: false
        type: boolean
      include-private:
        description: Include private packages
        required: true
        default: false
        type: boolean
      require-publish-config:
        description: Only include publishable packages
        required: true
        default: false
        type: boolean
      require-test-script:
        description: Only include packages with a test script
        required: true
        default: false
        type: boolean
      require-build-script:
        description: Only include packages with a build script
        required: true
        default: false
        type: boolean

  workflow_call:
    inputs:
      packages-directory:
        required: false
        default: packages
        type: string
      use-workspaces:
        required: false
        default: false
        type: boolean
      include-root-package:
        required: false
        default: false
        type: boolean
      include-private:
        required: false
        default: false
        type: boolean
      require-publish-config:
        required: false
        default: false
        type: boolean
      require-test-script:
        required: false
        default: false
        type: boolean
      require-build-script:
        required: false
        default: false
        type: boolean
    outputs:
      packages:
        description: Compact JSON array of discovered packages
        value: ${{ jobs.discover.outputs.packages }}
      matrix:
        description: GitHub Actions matrix object with include array
        value: ${{ jobs.discover.outputs.matrix }}
      has-packages:
        description: Whether any packages matched
        value: ${{ jobs.discover.outputs.has-packages }}
      count:
        description: Number of matching packages
        value: ${{ jobs.discover.outputs.count }}

permissions:
  contents: read

jobs:
  discover:
    name: "job: Discover"
    runs-on: ubuntu-latest
    outputs:
      packages: ${{ steps.packages.outputs.packages }}
      matrix: ${{ steps.packages.outputs.matrix }}
      has-packages: ${{ steps.packages.outputs.has-packages }}
      count: ${{ steps.packages.outputs.count }}

    steps:
      - name: Checkout caller repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - id: packages
        name: Discover packages
        uses: $/actions/discover-packages
        with:
          packages-directory: ${{ inputs.packages-directory }}
          use-workspaces: ${{ inputs.use-workspaces }}
          include-root-package: ${{ inputs.include-root-package }}
          include-private: ${{ inputs.include-private }}
          require-publish-config: ${{ inputs.require-publish-config }}
          require-test-script: ${{ inputs.require-test-script }}
          require-build-script: ${{ inputs.require-build-script }}
