name: "Reusable · Discover Packages"

on:
  workflow_dispatch:
    inputs:
      packages-directory:
        description: Directory containing direct-child packages when workspace discovery is disabled
        required: true
        default: packages
        type: string
      use-workspaces:
        description: Discover packages from root package.json workspaces patterns
        required: true
        default: false
        type: boolean
      include-root-package:
        description: Include the repository root package.json when it matches the filters
        required: true
        default: false
        type: boolean
      include-private:
        description: Include private packages
        required: true
        default: false
        type: boolean
      require-publish-config:
        description: Only include publishable packages
        required: true
        default: false
        type: boolean
      require-test-script:
        description: Only include packages with a test script
        required: true
        default: false
        type: boolean
      require-build-script:
        description: Only include packages with a build script
        required: true
        default: false
        type: boolean
      node-version:
        description: Node.js version
        required: true
        default: "24"
        type: string

  workflow_call:
    inputs:
      packages-directory:
        required: false
        default: packages
        type: string
      use-workspaces:
        required: false
        default: false
        type: boolean
      include-root-package:
        required: false
        default: false
        type: boolean
      include-private:
        required: false
        default: false
        type: boolean
      require-publish-config:
        required: false
        default: false
        type: boolean
      require-test-script:
        required: false
        default: false
        type: boolean
      require-build-script:
        required: false
        default: false
        type: boolean
      node-version:
        required: false
        default: "24"
        type: string
    outputs:
      packages:
        description: Compact JSON array of discovered packages
        value: ${{ jobs.discover.outputs.packages }}
      matrix:
        description: GitHub Actions matrix object with include array
        value: ${{ jobs.discover.outputs.matrix }}
      has-packages:
        description: Whether any packages matched
        value: ${{ jobs.discover.outputs.has-packages }}
      count:
        description: Number of matching packages
        value: ${{ jobs.discover.outputs.count }}

permissions:
  contents: read

jobs:
  discover:
    name: "job: Discover"
    runs-on: ubuntu-latest
    outputs:
      packages: ${{ steps.packages.outputs.packages }}
      matrix: ${{ steps.packages.outputs.matrix }}
      has-packages: ${{ steps.packages.outputs.has-packages }}
      count: ${{ steps.packages.outputs.count }}

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: ${{ inputs.node-version }}

      - name: Prepare package discovery CLI
        shell: bash
        run: |
          set -euo pipefail

          TOOL_ROOT="$(mktemp -d "$RUNNER_TEMP/workspace-tools.XXXXXX")"
          npm install \
            --prefix "$TOOL_ROOT" \
            --package-lock=false \
            --ignore-scripts \
            @moyarich/workspace-tools@latest

          DISCOVERY_CLI="$TOOL_ROOT/node_modules/@moyarich/workspace-tools/dist/bin/discover-packages.mjs"
          test -f "$DISCOVERY_CLI"
          echo "DISCOVERY_CLI=$DISCOVERY_CLI" >> "$GITHUB_ENV"

      - id: packages
        name: Discover packages
        env:
          PACKAGES_DIRECTORY: ${{ inputs.packages-directory }}
          USE_WORKSPACES: ${{ inputs.use-workspaces }}
          INCLUDE_ROOT_PACKAGE: ${{ inputs.include-root-package }}
          INCLUDE_PRIVATE: ${{ inputs.include-private }}
          REQUIRE_PUBLISH_CONFIG: ${{ inputs.require-publish-config }}
          REQUIRE_TEST_SCRIPT: ${{ inputs.require-test-script }}
          REQUIRE_BUILD_SCRIPT: ${{ inputs.require-build-script }}
        shell: bash
        run: |
          set -euo pipefail

          if [ "$USE_WORKSPACES" = "true" ]; then
            PACKAGES="$(
              INCLUDE_PRIVATE="$INCLUDE_PRIVATE" \
              REQUIRE_PUBLISH_CONFIG="$REQUIRE_PUBLISH_CONFIG" \
              REQUIRE_TEST_SCRIPT="$REQUIRE_TEST_SCRIPT" \
              REQUIRE_BUILD_SCRIPT="$REQUIRE_BUILD_SCRIPT" \
              node --input-type=module <<'NODE'
          import { execFileSync } from "node:child_process";
          import { readFileSync } from "node:fs";
          import path from "node:path";

          const root = JSON.parse(readFileSync("package.json", "utf8"));
          const raw = Array.isArray(root.workspaces)
            ? root.workspaces
            : Array.isArray(root.workspaces?.packages)
              ? root.workspaces.packages
              : [];

          const patterns = raw
            .map((value) => String(value).replace(/\/$/, ""))
            .filter(Boolean);

          const includePrivate = process.env.INCLUDE_PRIVATE === "true";
          const requirePublishConfig =
            process.env.REQUIRE_PUBLISH_CONFIG === "true";
          const requireTestScript =
            process.env.REQUIRE_TEST_SCRIPT === "true";
          const requireBuildScript =
            process.env.REQUIRE_BUILD_SCRIPT === "true";

          const files = new Set();

          for (const pattern of patterns) {
            const spec = `:(glob)${pattern}/package.json`;
            const output = execFileSync(
              "git",
              ["ls-files", "--cached", "-z", "--", spec],
              { encoding: "utf8" },
            );

            for (const file of output.split("\0").filter(Boolean)) {
              files.add(file);
            }
          }

          const packages = [];

          for (const file of files) {
            const manifest = JSON.parse(readFileSync(file, "utf8"));
            const directory = path.posix.dirname(file);
            const pkg = {
              directory,
              name: manifest.name ?? path.posix.basename(directory),
              version: manifest.version ?? "0.0.0",
              private: manifest.private === true,
              publishable:
                manifest.private !== true &&
                typeof manifest.publishConfig?.registry === "string",
              hasTest: typeof manifest.scripts?.test === "string",
              hasBuild: typeof manifest.scripts?.build === "string",
            };

            if (!includePrivate && pkg.private) continue;
            if (requirePublishConfig && !pkg.publishable) continue;
            if (requireTestScript && !pkg.hasTest) continue;
            if (requireBuildScript && !pkg.hasBuild) continue;

            packages.push(pkg);
          }

          packages.sort((a, b) => a.name.localeCompare(b.name));
          process.stdout.write(JSON.stringify(packages));
          NODE
            )"
          else
            ARGS=("$PACKAGES_DIRECTORY")
            if [ "$INCLUDE_PRIVATE" = "true" ]; then ARGS+=("--include-private"); fi
            if [ "$REQUIRE_PUBLISH_CONFIG" = "true" ]; then ARGS+=("--require-publish-config"); fi
            if [ "$REQUIRE_TEST_SCRIPT" = "true" ]; then ARGS+=("--require-test-script"); fi
            if [ "$REQUIRE_BUILD_SCRIPT" = "true" ]; then ARGS+=("--require-build-script"); fi

            PACKAGES="$(node "$DISCOVERY_CLI" "${ARGS[@]}" --json)"
          fi

          echo "$PACKAGES" | jq -e 'type == "array"' >/dev/null

          if [ "$INCLUDE_ROOT_PACKAGE" = "true" ] && [ -f package.json ]; then
            ROOT_PACKAGE="$(
              node --input-type=module <<'NODE'
          import { readFileSync } from "node:fs";

          const manifest = JSON.parse(readFileSync("package.json", "utf8"));

          const includePrivate = process.env.INCLUDE_PRIVATE === "true";
          const requirePublishConfig = process.env.REQUIRE_PUBLISH_CONFIG === "true";
          const requireTestScript = process.env.REQUIRE_TEST_SCRIPT === "true";
          const requireBuildScript = process.env.REQUIRE_BUILD_SCRIPT === "true";

          const matches =
            typeof manifest.name === "string" &&
            (!manifest.private || includePrivate) &&
            (!requirePublishConfig || Boolean(manifest.publishConfig)) &&
            (!requireTestScript || Boolean(manifest.scripts?.test)) &&
            (!requireBuildScript || Boolean(manifest.scripts?.build));

          if (matches) {
            process.stdout.write(
              JSON.stringify({
                name: manifest.name,
                version: manifest.version || "0.0.0",
                directory: ".",
                private: Boolean(manifest.private),
              }),
            );
          }
          NODE
            )"

            if [ -n "$ROOT_PACKAGE" ]; then
              PACKAGES="$(jq -c --argjson root "$ROOT_PACKAGE" '[$root] + .' <<< "$PACKAGES")"
            fi
          fi

          MATRIX="$(jq -cn --argjson packages "$PACKAGES" '{include: $packages}')"
          COUNT="$(jq 'length' <<< "$PACKAGES")"

          {
            echo "packages=$PACKAGES"
            echo "matrix=$MATRIX"
            echo "count=$COUNT"
            if [ "$COUNT" -gt 0 ]; then
              echo "has-packages=true"
            else
              echo "has-packages=false"
            fi
          } >> "$GITHUB_OUTPUT"

          {
            echo "# Package discovery"
            echo
            echo "| Setting | Value |"
            echo "| --- | --- |"
            echo "| Packages directory | \`${{ inputs.packages-directory }}\` |"
            echo "| Include private | **${{ inputs.include-private }}** |"
            echo "| Require publish config | **${{ inputs.require-publish-config }}** |"
            echo "| Require test script | **${{ inputs.require-test-script }}** |"
            echo "| Require build script | **${{ inputs.require-build-script }}** |"
            echo "| Count | **$COUNT** |"
            echo
            echo "~~~json"
            jq . <<< "$PACKAGES"
            echo "~~~"
          } >> "$GITHUB_STEP_SUMMARY"
