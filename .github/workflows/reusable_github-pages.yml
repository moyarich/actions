name: Reusable · GitHub Pages

on:
  workflow_dispatch:
    inputs:
      build-command:
        description: Command that builds the Pages site
        required: true
        type: string

      output-directory:
        description: Directory produced by the build command
        required: true
        type: string

      node-version:
        description: Node.js version used to build the site
        required: true
        default: "24"
        type: string

      install-command:
        description: Dependency installation command
        required: true
        default: npm ci --include=optional
        type: string

      working-directory:
        description: Directory in which install and build commands run
        required: true
        default: "."
        type: string

  workflow_call:
    inputs:
      build-command:
        description: Command that builds the Pages site
        required: true
        type: string

      output-directory:
        description: Directory produced by the build command
        required: true
        type: string

      node-version:
        description: Node.js version used to build the site
        required: false
        default: "24"
        type: string

      install-command:
        description: Dependency installation command
        required: false
        default: npm ci --include=optional
        type: string

      working-directory:
        description: Directory in which install and build commands run
        required: false
        default: "."
        type: string

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages-${{ github.workflow }}
  cancel-in-progress: true

jobs:
  build:
    name: "job: Build"
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7 # v7

      # ------------------------------------------------------------
      # Validate everything before install/build/filesystem traversal
      # ------------------------------------------------------------

      - name: Validate inputs
        env:
          WORKING_DIRECTORY: ${{ inputs.working-directory }}
          OUTPUT_DIRECTORY: ${{ inputs.output-directory }}
          NODE_VERSION: ${{ inputs.node-version }}
          INSTALL_COMMAND: ${{ inputs.install-command }}
          BUILD_COMMAND: ${{ inputs.build-command }}
        run: |
          set -euo pipefail

          fail() {
            echo "::error::$1"

            {
              echo "## GitHub Pages build"
              echo
              echo "### ❌ Input validation failed"
              echo
              echo "$1"
            } >> "$GITHUB_STEP_SUMMARY"

            exit 1
          }

          [ -n "$NODE_VERSION" ] ||
            fail "\`node-version\` must not be empty."

          [ -n "$WORKING_DIRECTORY" ] ||
            fail "\`working-directory\` must not be empty."

          [ -n "$OUTPUT_DIRECTORY" ] ||
            fail "\`output-directory\` must not be empty."

          [ -n "$INSTALL_COMMAND" ] ||
            fail "\`install-command\` must not be empty."

          [ -n "$BUILD_COMMAND" ] ||
            fail "\`build-command\` must not be empty."

          # Reject absolute paths and obvious parent traversal.
          case "$WORKING_DIRECTORY" in
            /|/*|..|../*|*/../*|*/..)
              fail "\`working-directory\` must stay inside the repository: \`$WORKING_DIRECTORY\`"
              ;;
          esac

          # The output directory must be an actual child directory.
          # In particular, never allow ".", "..", "/", or an absolute path.
          case "$OUTPUT_DIRECTORY" in
            ""|.|./|/|/*|..|../*|*/../*|*/..)
              fail "\`output-directory\` must be a non-root directory inside \`working-directory\`: \`$OUTPUT_DIRECTORY\`"
              ;;
          esac

          [ -d "$WORKING_DIRECTORY" ] ||
            fail "\`working-directory\` does not exist: \`$WORKING_DIRECTORY\`"

          WORKSPACE_REAL="$(realpath "$GITHUB_WORKSPACE")"
          WORKING_REAL="$(realpath "$WORKING_DIRECTORY")"

          case "$WORKING_REAL" in
            "$WORKSPACE_REAL"|"$WORKSPACE_REAL"/*)
              ;;
            *)
              fail "\`working-directory\` resolves outside the GitHub workspace: \`$WORKING_REAL\`"
              ;;
          esac

          {
            echo "## GitHub Pages build"
            echo
            echo "### ✅ Inputs validated"
            echo
            echo "| Setting | Value |"
            echo "| --- | --- |"
            echo "| Node.js | \`$NODE_VERSION\` |"
            echo "| Working directory | \`$WORKING_DIRECTORY\` |"
            echo "| Output directory | \`$OUTPUT_DIRECTORY\` |"
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Setup Node.js
        uses: actions/setup-node@v7 # v7
        with:
          node-version: ${{ inputs.node-version }}

      - name: Configure GitHub Pages
        id: pages
        uses: actions/configure-pages@v5

      # ------------------------------------------------------------
      # Install
      # ------------------------------------------------------------

      - name: Install dependencies
        working-directory: ${{ inputs.working-directory }}
        env:
          INSTALL_COMMAND: ${{ inputs.install-command }}
          NODE_AUTH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          bash -lc "$INSTALL_COMMAND"

      # ------------------------------------------------------------
      # Build
      # ------------------------------------------------------------

      - name: Build site
        working-directory: ${{ inputs.working-directory }}
        env:
          BUILD_COMMAND: ${{ inputs.build-command }}
          PAGES_BASE_PATH: ${{ steps.pages.outputs.base_path }}
          PAGES_BASE_URL: ${{ steps.pages.outputs.base_url }}
          PAGES_ORIGIN: ${{ steps.pages.outputs.origin }}
        run: |
          set -euo pipefail
          bash -lc "$BUILD_COMMAND"

      # ------------------------------------------------------------
      # Validate artifact before allowing upload/find
      # ------------------------------------------------------------

      - name: Validate Pages artifact
        env:
          WORKING_DIRECTORY: ${{ inputs.working-directory }}
          OUTPUT_DIRECTORY: ${{ inputs.output-directory }}
        run: |
          set -euo pipefail

          fail() {
            echo "::error::$1"

            {
              echo
              echo "### ❌ Artifact validation failed"
              echo
              echo "$1"
            } >> "$GITHUB_STEP_SUMMARY"

            exit 1
          }

          WORKSPACE_REAL="$(realpath "$GITHUB_WORKSPACE")"
          WORKING_REAL="$(realpath "$WORKING_DIRECTORY")"

          OUTPUT_PATH="${WORKING_DIRECTORY%/}/${OUTPUT_DIRECTORY#./}"

          [ -d "$OUTPUT_PATH" ] ||
            fail "Pages output directory does not exist: \`$OUTPUT_PATH\`"

          OUTPUT_REAL="$(realpath "$OUTPUT_PATH")"

          # Output must remain inside the working directory.
          case "$OUTPUT_REAL" in
            "$WORKING_REAL"/*)
              ;;
            *)
              fail "Pages output directory resolves outside the working directory: \`$OUTPUT_REAL\`"
              ;;
          esac

          # And, independently, it must remain inside the repository.
          case "$OUTPUT_REAL" in
            "$WORKSPACE_REAL"/*)
              ;;
            *)
              fail "Pages output directory resolves outside the GitHub workspace: \`$OUTPUT_REAL\`"
              ;;
          esac

          # Never permit the workspace or working directory itself
          # to become the Pages artifact.
          [ "$OUTPUT_REAL" != "$WORKSPACE_REAL" ] ||
            fail "The repository root cannot be used as the Pages artifact."

          [ "$OUTPUT_REAL" != "$WORKING_REAL" ] ||
            fail "The working directory cannot be used as the Pages artifact."

          # Stop immediately after finding one file.
          if ! find "$OUTPUT_REAL" \
            -type f \
            -print \
            -quit |
            grep -q .; then
            fail "Pages output directory contains no files: \`$OUTPUT_PATH\`"
          fi

          {
            echo
            echo "### ✅ Pages artifact validated"
            echo
            echo "| Setting | Value |"
            echo "| --- | --- |"
            echo "| Artifact path | \`$OUTPUT_PATH\` |"
          } >> "$GITHUB_STEP_SUMMARY"

      # ------------------------------------------------------------
      # Upload
      # ------------------------------------------------------------

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v4
        with:
          path: ${{ inputs.working-directory }}/${{ inputs.output-directory }}

      # ------------------------------------------------------------
      # Final build summary
      # ------------------------------------------------------------

      - name: Pages build summary
        if: always()
        env:
          NODE_VERSION: ${{ inputs.node-version }}
          WORKING_DIRECTORY: ${{ inputs.working-directory }}
          OUTPUT_DIRECTORY: ${{ inputs.output-directory }}
          INSTALL_COMMAND: ${{ inputs.install-command }}
          BUILD_COMMAND: ${{ inputs.build-command }}
          PAGES_BASE_PATH: ${{ steps.pages.outputs.base_path }}
          PAGES_BASE_URL: ${{ steps.pages.outputs.base_url }}
          PAGES_ORIGIN: ${{ steps.pages.outputs.origin }}
        run: |
          set -u

          OUTPUT_PATH="${WORKING_DIRECTORY%/}/${OUTPUT_DIRECTORY#./}"

          {
            echo
            echo "---"
            echo
            echo "## Build configuration"
            echo
            echo "| Setting | Value |"
            echo "| --- | --- |"
            echo "| Node.js | \`${NODE_VERSION:-—}\` |"
            echo "| Working directory | \`${WORKING_DIRECTORY:-—}\` |"
            echo "| Output directory | \`${OUTPUT_PATH:-—}\` |"
            echo "| Base path | \`${PAGES_BASE_PATH:-—}\` |"
            echo "| Base URL | ${PAGES_BASE_URL:-—} |"
            echo "| Origin | ${PAGES_ORIGIN:-—} |"

            if [ "${ACT:-false}" = "true" ]; then
              echo "| Environment | \`act (local)\` |"
            else
              echo "| Environment | \`GitHub Actions\` |"
            fi

            echo
            echo "### Install command"
            echo
            echo '```sh'
            echo "${INSTALL_COMMAND:-}"
            echo '```'

            echo
            echo "### Build command"
            echo
            echo '```sh'
            echo "${BUILD_COMMAND:-}"
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

          # Only inspect the artifact when all of these conditions are true.
          #
          # This prevents an empty/malformed input from accidentally causing
          # find to inspect the repository or another large directory.

          if [ -z "${OUTPUT_DIRECTORY:-}" ]; then
            {
              echo
              echo "### Pages artifact"
              echo
              echo "Artifact listing skipped because \`output-directory\` is empty."
            } >> "$GITHUB_STEP_SUMMARY"

            exit 0
          fi

          case "$OUTPUT_DIRECTORY" in
            .|./|/|/*|..|../*|*/../*|*/..)
              {
                echo
                echo "### Pages artifact"
                echo
                echo "Artifact listing skipped because the output path is unsafe."
              } >> "$GITHUB_STEP_SUMMARY"

              exit 0
              ;;
          esac

          if [ ! -d "$OUTPUT_PATH" ]; then
            {
              echo
              echo "### Pages artifact"
              echo
              echo "Artifact directory does not exist."
            } >> "$GITHUB_STEP_SUMMARY"

            exit 0
          fi

          WORKSPACE_REAL="$(realpath "$GITHUB_WORKSPACE")"
          WORKING_REAL="$(realpath "$WORKING_DIRECTORY" 2>/dev/null || true)"
          OUTPUT_REAL="$(realpath "$OUTPUT_PATH" 2>/dev/null || true)"

          if [ -z "$OUTPUT_REAL" ] ||
             [ "$OUTPUT_REAL" = "$WORKSPACE_REAL" ] ||
             [ "$OUTPUT_REAL" = "$WORKING_REAL" ]; then
            {
              echo
              echo "### Pages artifact"
              echo
              echo "Artifact listing skipped because the resolved path is unsafe."
            } >> "$GITHUB_STEP_SUMMARY"

            exit 0
          fi

          case "$OUTPUT_REAL" in
            "$WORKSPACE_REAL"/*)
              ;;
            *)
              {
                echo
                echo "### Pages artifact"
                echo
                echo "Artifact listing skipped because the path resolves outside the repository."
              } >> "$GITHUB_STEP_SUMMARY"

              exit 0
              ;;
          esac

          {
            echo
            echo "### Pages artifact"
            echo
            echo "Showing at most 100 files, up to two directories deep."
            echo
            echo '```text'

            find "$OUTPUT_REAL" \
              -maxdepth 2 \
              -type f \
              -print |
              sort |
              head -100

            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

  deploy:
    name: "job: Deploy"
    runs-on: ubuntu-latest
    needs: build

    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        if: ${{ env.ACT != 'true' }}
        uses: actions/deploy-pages@v4

      - name: Local deployment summary
        if: ${{ env.ACT == 'true' }}
        run: |
          {
            echo "## GitHub Pages deployment"
            echo
            echo "### Deployment skipped"
            echo
            echo "The Pages site was built and its artifact was uploaded successfully."
            echo
            echo
            echo "Deployment is skipped when running locally with \`act\` because GitHub Pages deployment requires GitHub's OIDC environment."
          } >> "$GITHUB_STEP_SUMMARY"

      - name: GitHub Pages deployment summary
        if: ${{ env.ACT != 'true' && always() }}
        env:
          PAGE_URL: ${{ steps.deployment.outputs.page_url }}
          DEPLOYMENT_OUTCOME: ${{ steps.deployment.outcome }}
        run: |
          {
            echo "## GitHub Pages deployment"
            echo
            echo "| Setting | Value |"
            echo "| --- | --- |"
            echo "| Result | \`${DEPLOYMENT_OUTCOME:-unknown}\` |"

            if [ -n "${PAGE_URL:-}" ]; then
              echo "| URL | ${PAGE_URL} |"
            else
              echo "| URL | — |"
            fi

            echo

            if [ "${DEPLOYMENT_OUTCOME:-}" = "success" ]; then
              echo "### ✅ Deployment complete"
              echo
              echo "${PAGE_URL}"
            else
              echo "### ❌ Deployment did not complete successfully"
            fi
          } >> "$GITHUB_STEP_SUMMARY"
