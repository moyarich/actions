name: Reusable ·  Manage issue dependencies

on:
  workflow_dispatch:
    inputs:
      issue:
        description: "Issue number or URL"
        required: true
        type: string
      relationship:
        description: "Relationship to the related issue(s)"
        required: true
        default: blocked-by
        type: choice
        options:
          - blocked-by
          - blocking
      action:
        description: "Dependency action"
        required: true
        default: add
        type: choice
        options:
          - add
          - remove
      related_issues:
        description: "Related issue numbers or URLs, comma-separated"
        required: true
        type: string
      dry_run:
        description: "Preview the change without applying it"
        required: false
        default: false
        type: boolean

  workflow_call:
    inputs:
      issue:
        description: "Issue number or URL"
        required: true
        type: string
      relationship:
        description: "Relationship to the related issue(s)"
        required: false
        default: blocked-by
        type: string
      action:
        description: "Dependency action"
        required: false
        default: add
        type: string
      related_issues:
        description: "Related issue numbers or URLs, comma-separated"
        required: true
        type: string
      dry_run:
        description: "Preview the change without applying it"
        required: false
        default: false
        type: boolean

permissions:
  contents: read
  issues: write

jobs:
  manage-dependencies:
    name: Manage native issue dependencies
    runs-on: ubuntu-latest
    env:
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
      ISSUE: ${{ inputs.issue }}
      RELATIONSHIP: ${{ inputs.relationship }}
      ACTION: ${{ inputs.action }}
      RELATED_ISSUES: ${{ inputs.related_issues }}
      DRY_RUN: ${{ inputs.dry_run }}

    steps:
      - name: Manage dependencies
        shell: bash
        run: |
          set -euo pipefail

          normalize_related_issues() {
            printf '%s' "$RELATED_ISSUES" \
              | tr '\n' ',' \
              | sed -E 's/[[:space:]]*,[[:space:]]*/,/g; s/^[[:space:],]+//; s/[[:space:],]+$//'
          }

          related="$(normalize_related_issues)"

          if [ -z "$related" ]; then
            echo "No related issues were provided." >&2
            exit 1
          fi

          case "$RELATIONSHIP:$ACTION" in
            blocked-by:add)
              flag="--add-blocked-by"
              ;;
            blocked-by:remove)
              flag="--remove-blocked-by"
              ;;
            blocking:add)
              flag="--add-blocking"
              ;;
            blocking:remove)
              flag="--remove-blocking"
              ;;
            *)
              echo "Unsupported relationship/action: $RELATIONSHIP / $ACTION" >&2
              exit 1
              ;;
          esac

          {
            echo "# Issue dependency update"
            echo
            echo "| Field | Value |"
            echo "| --- | --- |"
            echo "| Issue | `$ISSUE` |"
            echo "| Relationship | `$RELATIONSHIP` |"
            echo "| Action | `$ACTION` |"
            echo "| Related issues | `$related` |"
            echo "| Dry run | `$DRY_RUN` |"
            echo
            echo "## Before"
            echo
            echo '~~~json'
            gh issue view "$ISSUE" \
              --repo "$GH_REPO" \
              --json number,title,state,blockedBy,blocking \
              | jq '.'
            echo '~~~'
          } >> "$GITHUB_STEP_SUMMARY"

          echo "gh issue edit $ISSUE --repo $GH_REPO $flag $related"

          if [ "$DRY_RUN" != "true" ]; then
            gh issue edit "$ISSUE" \
              --repo "$GH_REPO" \
              "$flag" "$related"
          fi

          {
            echo
            if [ "$DRY_RUN" = "true" ]; then
              echo "## Preview"
              echo
              echo "_No changes were applied._"
            else
              echo "## After"
              echo
              echo '~~~json'
              gh issue view "$ISSUE" \
                --repo "$GH_REPO" \
                --json number,title,state,blockedBy,blocking \
                | jq '.'
              echo '~~~'
            fi
          } >> "$GITHUB_STEP_SUMMARY"
