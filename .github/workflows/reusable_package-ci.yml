name: "Reusable · Package CI"

on:
  workflow_dispatch:
    inputs:
      node-version:
        description: Node.js version used to run package CI
        required: true
        default: "24"
        type: string
      packages-directory:
        description: Directory containing workspace packages
        required: true
        default: packages
        type: string

  workflow_call:
    inputs:
      node-version:
        description: Node.js version used to run package CI
        required: false
        type: string
        default: "24"
      packages-directory:
        description: Directory containing workspace packages
        required: false
        type: string
        default: packages

permissions:
  contents: read
  packages: read

jobs:
  discover-packages:
    name: "Discover packages"
    uses: $/.github/workflows/reusable_discover-packages.yml
    with:
      packages-directory: ${{ inputs.packages-directory }}
      require-test-script: true
      node-version: ${{ inputs.node-version }}

  check-packages:
    name: "package: ${{ matrix.name }} | dir: ${{ matrix.directory }}"
    needs: discover-packages
    if: >-
      ${{ needs.discover-packages.result == 'success' &&
          needs.discover-packages.outputs.has-packages == 'true' }}
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.discover-packages.outputs.matrix || '{"include":[]}') }}
    uses: $/.github/workflows/reusable_node-ci.yml
    with:
      package-directory: ${{ matrix.directory }}
      node-version: ${{ inputs.node-version }}
    secrets: inherit
