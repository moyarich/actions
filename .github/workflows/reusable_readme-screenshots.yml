name: "Reusable · README Screenshots"

on:
  workflow_dispatch:
    inputs:
      start-command:
        description: Command that starts the site to capture
        required: true
        type: string
      url:
        description: URL to wait for and capture
        required: true
        default: http://127.0.0.1:5173
        type: string
      config:
        description: Screenshot config file
        required: false
        default: ""
        type: string
      output-directory:
        description: Directory containing generated screenshots
        required: true
        default: docs/screenshots
        type: string
      node-version:
        description: Node.js version
        required: true
        default: "24"
        type: string
      playwright-version:
        description: Playwright version
        required: true
        default: "latest"
        type: string
      commit-message:
        description: Commit message for changed screenshots
        required: true
        default: "docs: update README screenshots"
        type: string
  workflow_call:
    inputs:
      start-command:
        description: Command that starts the site to capture
        required: true
        type: string
      url:
        description: URL to wait for and capture
        required: false
        default: http://127.0.0.1:5173
        type: string
      config:
        description: Screenshot config file
        required: false
        default: ""
        type: string
      output-directory:
        description: Directory containing generated screenshots
        required: false
        default: docs/screenshots
        type: string
      node-version:
        required: false
        default: "24"
        type: string
      playwright-version:
        required: false
        default: "latest"
        type: string
      commit-message:
        required: false
        default: "docs: update README screenshots"
        type: string

permissions:
  contents: write
  packages: read

jobs:
  update-readme-screenshots:
    name: "Update README screenshots"
    runs-on: ubuntu-latest
    steps:
      - name: Initialize workflow summary
        if: ${{ always() }}
        shell: bash
        run: |
          {
            echo "# Reusable · README Screenshots"
            echo
            echo "| Execution | Value |"
            echo "| --- | --- |"
            echo "| Workflow | \`Reusable · README Screenshots\` |"
            echo "| Job | \`${{ github.job }}\` |"
            echo "| Repository | \`${{ github.repository }}\` |"
            echo "| Ref | \`${{ github.ref_name }}\` |"
            echo "| Run | \`#${{ github.run_number }}\` |"
            echo
          } >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/checkout@v7 # v7
        with:
          ref: ${{ github.ref_name }}
      - uses: actions/setup-node@v7 # v7
        with:
          node-version: ${{ inputs.node-version }}
          registry-url: https://npm.pkg.github.com
          scope: "@moyarich"
          cache: npm
      - run: npm ci --include=optional
        env:
          NODE_AUTH_TOKEN: ${{ github.token }}
      - name: Resolve screenshot tooling
        env:
          NODE_AUTH_TOKEN: ${{ github.token }}
          PLAYWRIGHT_VERSION: ${{ inputs.playwright-version }}
        run: |
          set -euo pipefail
          if [ -f packages/readme-screenshots/package.json ]; then
            npm run build
            TOOL_PACKAGE_ROOT="$(cd packages/readme-screenshots && pwd -P)"
            npx playwright install --with-deps chromium
          else
            TOOL_ROOT="$(mktemp -d "$RUNNER_TEMP/screenshot-tools.XXXXXX")"
            npm install --prefix "$TOOL_ROOT" --no-save --package-lock=false "playwright@$PLAYWRIGHT_VERSION" @moyarich/readme-screenshots@latest
            TOOL_PACKAGE_ROOT="$TOOL_ROOT/node_modules/@moyarich/readme-screenshots"
            "$TOOL_ROOT/node_modules/.bin/playwright" install --with-deps chromium
          fi
          TOOL_BIN_ROOT=""
          for CANDIDATE in "$TOOL_PACKAGE_ROOT/dist/bin" "$TOOL_PACKAGE_ROOT/bin"; do
            if [ -f "$CANDIDATE/readme-screenshots.mjs" ]; then
              TOOL_BIN_ROOT="$CANDIDATE"
              break
            fi
          done

          if [ -z "$TOOL_BIN_ROOT" ]; then
            echo "Unable to resolve packaged CLI directory under $TOOL_PACKAGE_ROOT." >&2
            exit 1
          fi

          echo "SCREENSHOT_TOOLS_ROOT=$TOOL_PACKAGE_ROOT" >> "$GITHUB_ENV"
          echo "SCREENSHOT_TOOLS_BIN=$TOOL_BIN_ROOT" >> "$GITHUB_ENV"
      - name: Start site
        env:
          START_COMMAND: ${{ inputs.start-command }}
          PLAYGROUND_URL: ${{ inputs.url }}
        run: |
          bash -lc "$START_COMMAND" > /tmp/readme-screenshots.log 2>&1 &
          for i in {1..60}; do
            if curl --fail --silent "$PLAYGROUND_URL" >/dev/null; then exit 0; fi
            sleep 1
          done
          cat /tmp/readme-screenshots.log
          exit 1
      - name: Generate screenshots
        env:
          PLAYGROUND_URL: ${{ inputs.url }}
          DEMO_OUTPUT_DIR: ${{ inputs.output-directory }}
        run: |
          case "${{ inputs.config }}" in
            "") node "$SCREENSHOT_TOOLS_BIN/readme-screenshots.mjs" ;;
            *) node "$SCREENSHOT_TOOLS_BIN/readme-screenshots.mjs" "${{ inputs.config }}" ;;
          esac
      - name: Commit screenshots when changed
        env:
          OUTPUT_DIRECTORY: ${{ inputs.output-directory }}
          COMMIT_MESSAGE: ${{ inputs.commit-message }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -- "$OUTPUT_DIRECTORY"
          git diff --cached --quiet && exit 0
          git commit -m "$COMMIT_MESSAGE"
          git push origin "HEAD:${{ github.ref_name }}"

      - name: Screenshot summary
        if: ${{ always() }}
        run: |
          {
            echo "## README screenshots"
            echo
            echo "| Setting | Value |"
            echo "| --- | --- |"
            echo "| URL | \`${{ inputs.url }}\` |"
            echo "| Output directory | \`${{ inputs.output-directory }}\` |"
            echo "| Config | \`${{ inputs.config || 'default' }}\` |"
            echo "| Node.js | \`${{ inputs.node-version }}\` |"
            echo "| Playwright | \`${{ inputs.playwright-version }}\` |"
            echo "| Commit changes | **yes, when generated files changed** |"
            echo "| Result | **${{ job.status }}** |"
          } >> "$GITHUB_STEP_SUMMARY"
