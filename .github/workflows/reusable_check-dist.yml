name: Reusable · Check dist

on:
  workflow_call:
    inputs:
      dist-path:
        description: Distribution directory to rebuild and compare.
        required: false
        type: string
        default: dist/
      build-command:
        description: Command used to rebuild the distribution output.
        required: false
        type: string
        default: npm run build
      node-version:
        description: Node.js version passed to actions/setup-node.
        required: false
        type: string
        default: "24"
      node-caching:
        description: Cache mode passed to actions/setup-node. Use an empty string to disable caching.
        required: false
        type: string
        default: npm
      artifact-name:
        description: Artifact name used when rebuilt distribution output differs.
        required: false
        type: string
        default: dist

permissions:
  contents: read

jobs:
  check-dist:
    name: Check committed dist
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Setup Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: ${{ inputs.node-version }}
          cache: ${{ inputs.node-caching }}

      - name: Install dependencies
        run: npm ci --ignore-scripts

      - name: Rebuild distribution output
        env:
          BUILD_COMMAND: ${{ inputs.build-command }}
        shell: bash
        run: |
          set -euo pipefail
          bash -lc "$BUILD_COMMAND"

      - name: Compare committed and rebuilt dist
        id: diff
        env:
          DIST_PATH: ${{ inputs.dist-path }}
        shell: bash
        run: |
          set -euo pipefail

          if [ -n "$(git status --porcelain -- "$DIST_PATH")" ]; then
            echo "::error::Committed distribution output does not match the build."
            git status --short -- "$DIST_PATH"
            git diff --text -- "$DIST_PATH"
            exit 1
          fi

      - name: Upload rebuilt dist
        if: ${{ failure() && steps.diff.conclusion == 'failure' }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: ${{ inputs.artifact-name }}
          path: ${{ inputs.dist-path }}
