name: Delete release tag

run-name: Delete release tag · ${{ inputs.tag }}

on:
  workflow_dispatch:
    inputs:
      tag:
        description: Exact Git tag to delete
        required: true
        type: string
      confirm:
        description: Type DELETE to confirm
        required: true
        type: string
  workflow_call:
    inputs:
      tag:
        description: Exact Git tag to delete
        required: true
        type: string
      confirm:
        description: Type DELETE to confirm
        required: true
        type: string


    
permissions: {}

jobs:
  delete-tag:
    name: "job: Delete tag"
    runs-on: ubuntu-latest
    permissions:
      contents: write
    env:
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
      TAG: ${{ inputs.tag }}
    steps:
      - name: Validate confirmation
        shell: bash
        run: |
          set -euo pipefail

          if [ "${{ inputs.confirm }}" != "DELETE" ]; then
            echo "::error::Confirmation must be exactly DELETE."
            exit 1
          fi

          if [ -z "$TAG" ]; then
            echo "::error::Tag must not be empty."
            exit 1
          fi

      - name: Verify tag exists
        id: verify
        shell: bash
        run: |
          set -euo pipefail

          ENCODED_TAG="$(jq -rn --arg value "$TAG" '$value | @uri')"
          REF="$(gh api "repos/$GH_REPO/git/ref/tags/$ENCODED_TAG")"

          echo "exists=true" >> "$GITHUB_OUTPUT"
          echo "sha=$(jq -r '.object.sha' <<< "$REF")" >> "$GITHUB_OUTPUT"

      - name: Delete tag
        shell: bash
        run: |
          set -euo pipefail

          ENCODED_TAG="$(jq -rn --arg value "$TAG" '$value | @uri')"

          gh api             --method DELETE             "repos/$GH_REPO/git/refs/tags/$ENCODED_TAG"

      - name: Verify tag was deleted
        id: verify-deleted
        shell: bash
        run: |
          set -euo pipefail

          ENCODED_TAG="$(jq -rn --arg value "$TAG" '$value | @uri')"

          if gh api "repos/$GH_REPO/git/ref/tags/$ENCODED_TAG" >/dev/null 2>&1; then
            echo "deleted=false" >> "$GITHUB_OUTPUT"
            echo "::error::Tag still exists after deletion: $TAG"
            exit 1
          fi

          echo "deleted=true" >> "$GITHUB_OUTPUT"

      - name: Summary
        if: ${{ always() }}
        shell: bash
        run: |
          {
            echo "# Delete release tag"
            echo
            echo "| Setting | Value |"
            echo "| --- | --- |"
            printf '| Repository | `%s` |\n' "$GH_REPO"
            printf '| Tag | `%s` |\n' "$TAG"
            printf '| Previous tag commit | `%s` |\n' "${{ steps.verify.outputs.sha || 'unresolved' }}"
            echo "| Tag existed | **${{ steps.verify.outputs.exists || 'false' }}** |"
            echo "| Delete requested | **${{ steps.delete.outputs.deleted || 'false' }}** |"
            echo "| Deletion verified | **${{ steps.verify-deleted.outputs.deleted || 'false' }}** |"
            echo "| GitHub Release | **unchanged** |"
            echo "| Result | **${{ job.status }}** |"
          } >> "$GITHUB_STEP_SUMMARY"
