name: "Reusable · Delete release tag"

run-name: Delete release tag · ${{ inputs.tag }} · dry-run=${{ inputs.dry-run }}

on:
  workflow_dispatch:
    inputs:
      tag:
        description: Exact Git tag or fuzzy search text
        required: true
        type: string
      dry-run:
        description: Preview tag resolution without deleting
        required: true
        default: true
        type: boolean
  workflow_call:
    inputs:
      tag:
        description: Exact Git tag or fuzzy search text
        required: true
        type: string
      dry-run:
        description: Preview tag resolution without deleting
        required: false
        default: true
        type: boolean
    outputs:
      resolved-tag:
        description: Exact tag resolved from the supplied tag or fuzzy search text
        value: ${{ jobs.delete-tag.outputs.resolved-tag }}
      tag-existed:
        description: Whether a matching tag existed before the workflow ran
        value: ${{ jobs.delete-tag.outputs.tag-existed }}
      deleted:
        description: Whether the resolved tag was deleted
        value: ${{ jobs.delete-tag.outputs.deleted }}
      previous-tag-sha:
        description: Commit or tag-object SHA previously referenced by the resolved tag
        value: ${{ jobs.delete-tag.outputs.previous-tag-sha }}

permissions: {}

jobs:
  delete-tag:
    name: "job: Delete tag"
    runs-on: ubuntu-latest
    permissions:
      contents: write
    outputs:
      resolved-tag: ${{ steps.resolve.outputs.tag }}
      tag-existed: ${{ steps.resolve.outputs.exists }}
      deleted: ${{ steps.delete.outputs.deleted || 'false' }}
      previous-tag-sha: ${{ steps.resolve.outputs.sha }}
    env:
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
      TAG_QUERY: ${{ inputs.tag }}
      DRY_RUN: ${{ inputs.dry-run }}
    steps:
      - name: Validate inputs
        shell: bash
        run: |
          set -euo pipefail

          if [ -z "$TAG_QUERY" ]; then
            echo "::error::Tag search text must not be empty."
            exit 1
          fi

      - name: Resolve tag
        id: resolve
        shell: bash
        run: |
          set -euo pipefail

          TAGS="$(
            gh api --paginate "repos/$GH_REPO/tags?per_page=100" \
              --jq '.[].name'
          )"

          EXACT="$(printf '%s\n' "$TAGS" | grep -Fx -- "$TAG_QUERY" || true)"

          if [ -n "$EXACT" ]; then
            RESOLVED_TAG="$EXACT"
            MATCH_COUNT=1
          else
            MATCHES="$(
              printf '%s\n' "$TAGS" |
                awk -v query="$TAG_QUERY" '
                  BEGIN { q = tolower(query) }
                  index(tolower($0), q) > 0
                '
            )"
            MATCH_COUNT="$(printf '%s\n' "$MATCHES" | sed '/^$/d' | wc -l | tr -d ' ')"

            if [ "$MATCH_COUNT" -eq 1 ]; then
              RESOLVED_TAG="$MATCHES"
            elif [ "$MATCH_COUNT" -eq 0 ]; then
              echo "exists=false" >> "$GITHUB_OUTPUT"
              echo "tag=" >> "$GITHUB_OUTPUT"
              echo "sha=" >> "$GITHUB_OUTPUT"
              echo "match-count=0" >> "$GITHUB_OUTPUT"
              echo "No tag matched: $TAG_QUERY"
              exit 0
            else
              {
                echo "## Ambiguous tag search"
                echo
                printf 'Search: `%s`\n\n' "$TAG_QUERY"
                echo "Matching tags:"
                echo
                printf '%s\n' "$MATCHES" | sed 's/^/- `/' | sed 's/$/`/'
              } >> "$GITHUB_STEP_SUMMARY"

              echo "::error::Tag search matched $MATCH_COUNT tags. Use a more specific value."
              exit 1
            fi
          fi

          ENCODED_TAG="$(jq -rn --arg value "$RESOLVED_TAG" '$value | @uri')"
          REF="$(gh api "repos/$GH_REPO/git/ref/tags/$ENCODED_TAG")"

          echo "exists=true" >> "$GITHUB_OUTPUT"
          echo "tag=$RESOLVED_TAG" >> "$GITHUB_OUTPUT"
          echo "sha=$(jq -r '.object.sha' <<< "$REF")" >> "$GITHUB_OUTPUT"
          echo "match-count=$MATCH_COUNT" >> "$GITHUB_OUTPUT"

      - name: Delete tag
        id: delete
        if: ${{ !inputs.dry-run && steps.resolve.outputs.exists == 'true' }}
        env:
          RESOLVED_TAG: ${{ steps.resolve.outputs.tag }}
        shell: bash
        run: |
          set -euo pipefail

          ENCODED_TAG="$(jq -rn --arg value "$RESOLVED_TAG" '$value | @uri')"

          gh api \
            --method DELETE \
            "repos/$GH_REPO/git/refs/tags/$ENCODED_TAG"

          echo "deleted=true" >> "$GITHUB_OUTPUT"

      - name: Verify tag was deleted
        id: verify-deleted
        if: ${{ !inputs.dry-run && steps.resolve.outputs.exists == 'true' }}
        env:
          RESOLVED_TAG: ${{ steps.resolve.outputs.tag }}
        shell: bash
        run: |
          set -euo pipefail

          ENCODED_TAG="$(jq -rn --arg value "$RESOLVED_TAG" '$value | @uri')"

          if gh api "repos/$GH_REPO/git/ref/tags/$ENCODED_TAG" >/dev/null 2>&1; then
            echo "deleted=false" >> "$GITHUB_OUTPUT"
            echo "::error::Tag still exists after deletion: $RESOLVED_TAG"
            exit 1
          fi

          echo "deleted=true" >> "$GITHUB_OUTPUT"

      - name: Summary
        if: ${{ always() }}
        shell: bash
        run: |
          {
            echo "# Delete release tag"
            echo
            echo "| Setting | Value |"
            echo "| --- | --- |"
            printf '| Repository | `%s` |\n' "$GH_REPO"
            printf '| Dry run | **%s** |\n' "$DRY_RUN"
            printf '| Tag search | `%s` |\n' "$TAG_QUERY"
            printf '| Resolved tag | `%s` |\n' "${{ steps.resolve.outputs.tag || 'none' }}"
            printf '| Match count | `%s` |\n' "${{ steps.resolve.outputs.match-count || '0' }}"
            printf '| Previous tag SHA | `%s` |\n' "${{ steps.resolve.outputs.sha || 'none' }}"
            echo "| Tag existed | **${{ steps.resolve.outputs.exists || 'false' }}** |"

            if [ "$DRY_RUN" = "true" ]; then
              echo "| Delete requested | **preview only** |"
              echo "| Deletion verified | **not applicable** |"
            else
              echo "| Delete requested | **${{ steps.delete.outputs.deleted || 'not needed' }}** |"
              echo "| Deletion verified | **${{ steps.verify-deleted.outputs.deleted || 'not needed' }}** |"
            fi

            echo "| GitHub Release | **unchanged** |"
            echo "| Result | **${{ job.status }}** |"
          } >> "$GITHUB_STEP_SUMMARY"
