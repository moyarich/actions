name: "Reusable · Delete release tag"

run-name: Delete release tag · ${{ inputs.tag }}

on:
  workflow_dispatch:
    inputs:
      tag:
        description: Exact Git tag to delete
        required: true
        type: string
      confirm:
        description: Type DELETE to confirm
        required: true
        type: string
  workflow_call:
    inputs:
      tag:
        description: Exact Git tag to delete
        required: true
        type: string
      confirm:
        description: Type DELETE to confirm
        required: true
        type: string
    outputs:
      tag-existed:
        description: Whether the tag existed before the workflow ran
        value: ${{ jobs.delete-tag.outputs.tag-existed }}
      deleted:
        description: Whether the tag is absent after the workflow completes
        value: ${{ jobs.delete-tag.outputs.deleted }}
      previous-tag-sha:
        description: Commit or tag-object SHA previously referenced by the tag
        value: ${{ jobs.delete-tag.outputs.previous-tag-sha }}

permissions: {}

jobs:
  delete-tag:
    name: "job: Delete tag"
    runs-on: ubuntu-latest
    permissions:
      contents: write
    outputs:
      tag-existed: ${{ steps.verify.outputs.exists }}
      deleted: ${{ steps.verify-deleted.outputs.deleted }}
      previous-tag-sha: ${{ steps.verify.outputs.sha }}
    env:
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
      TAG: ${{ inputs.tag }}
    steps:
      - name: Validate confirmation
        shell: bash
        run: |
          set -euo pipefail

          if [ "${{ inputs.confirm }}" != "DELETE" ]; then
            echo "::error::Confirmation must be exactly DELETE."
            exit 1
          fi

          if [ -z "$TAG" ]; then
            echo "::error::Tag must not be empty."
            exit 1
          fi

      - name: Verify tag exists
        id: verify
        shell: bash
        run: |
          set -euo pipefail

          ENCODED_TAG="$(jq -rn --arg value "$TAG" '$value | @uri')"

          if REF="$(gh api "repos/$GH_REPO/git/ref/tags/$ENCODED_TAG" 2>/dev/null)"; then
            echo "exists=true" >> "$GITHUB_OUTPUT"
            echo "sha=$(jq -r '.object.sha' <<< "$REF")" >> "$GITHUB_OUTPUT"
          else
            echo "exists=false" >> "$GITHUB_OUTPUT"
            echo "sha=" >> "$GITHUB_OUTPUT"
          fi

      - name: Delete tag
        id: delete
        if: ${{ steps.verify.outputs.exists == 'true' }}
        shell: bash
        run: |
          set -euo pipefail

          ENCODED_TAG="$(jq -rn --arg value "$TAG" '$value | @uri')"

          gh api \
            --method DELETE \
            "repos/$GH_REPO/git/refs/tags/$ENCODED_TAG"

          echo "deleted=true" >> "$GITHUB_OUTPUT"

      - name: Verify tag was deleted
        id: verify-deleted
        shell: bash
        run: |
          set -euo pipefail

          ENCODED_TAG="$(jq -rn --arg value "$TAG" '$value | @uri')"

          if gh api "repos/$GH_REPO/git/ref/tags/$ENCODED_TAG" >/dev/null 2>&1; then
            echo "deleted=false" >> "$GITHUB_OUTPUT"
            echo "::error::Tag still exists after deletion: $TAG"
            exit 1
          fi

          echo "deleted=true" >> "$GITHUB_OUTPUT"

      - name: Summary
        if: ${{ always() }}
        shell: bash
        run: |
          {
            echo "# Delete release tag"
            echo
            echo "| Setting | Value |"
            echo "| --- | --- |"
            printf '| Repository | `%s` |\n' "$GH_REPO"
            printf '| Tag | `%s` |\n' "$TAG"
            printf '| Previous tag SHA | `%s` |\n' "${{ steps.verify.outputs.sha || 'none' }}"
            echo "| Tag existed | **${{ steps.verify.outputs.exists || 'false' }}** |"
            echo "| Delete requested | **${{ steps.delete.outputs.deleted || 'not needed' }}** |"
            echo "| Deletion verified | **${{ steps.verify-deleted.outputs.deleted || 'false' }}** |"
            echo "| GitHub Release | **unchanged** |"
            echo "| Result | **${{ job.status }}** |"
          } >> "$GITHUB_STEP_SUMMARY"
