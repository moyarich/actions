name: Restore Release

run-name: >-
  Restore release · ${{ inputs.package }} · ${{ inputs.restore-source }} · dry-run=${{ inputs.dry-run }}

on:
  workflow_dispatch:
    inputs:
      package:
        description: Package selector
        required: true
        default: "."
        type: string
      target-branch:
        description: Branch used to resolve the package path and changelog
        required: true
        default: main
        type: string
      restore-source:
        description: "Historical source: commit:<sha>, tag:<tag>, run:<id>, artifact:<id>, or github-url:<supported GitHub URL>"
        required: true
        type: string
      match-mode:
        description: Find release by package version or exact tag
        required: true
        default: package-json
        type: choice
        options:
          - package-json
          - exact
      exact-tag:
        description: Existing release tag to match when match-mode is exact
        required: false
        default: ""
        type: string
      dry-run:
        description: Preview recovery without mutating the release or tag
        required: true
        default: true
        type: boolean

permissions: {}

jobs:
  restore:
    name: "Restore release"
    permissions:
      actions: read
      contents: write
      packages: read
      pull-requests: read
    uses: moyarich/reusable-workflows/.github/workflows/reusable_restore-release.yml@main
    with:
      draft-template-path: .github/release-drafter-package-template.yml
      package: ${{ inputs.package }}
      target-branch: ${{ inputs.target-branch }}
      match-mode: ${{ inputs.match-mode }}
      exact-tag: ${{ inputs.exact-tag }}
      restore-source: ${{ inputs.restore-source }}
      dry-run: ${{ inputs.dry-run }}
