name: Deploy playground to GitHub Pages

on:
  push:
    branches:
      - main
    paths:
      - "apps/playground/**"
      - "docs/**"
      - "examples/**"
      - ".github/workflows/pages.yml"
      - ".github/workflows/reusable_github-pages.yml"
      - "package.json"
      - "package-lock.json"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

jobs:
  pages:
    uses: ./.github/workflows/reusable_github-pages.yml
    with:
      node-version: "24"
      build-command: npm run build:playground -- --base=/actions/
      output-directory: apps/playground/dist
    secrets: inherit
