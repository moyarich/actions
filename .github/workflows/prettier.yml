name: Self-heal · Prettier

on:
  pull_request:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: self-heal-${{ github.ref }}
  cancel-in-progress: false

jobs:
  prettier:
    uses: ./.github/workflows/reusable_prettier.yml
    with:
      commit: true
      node-version: "24"
